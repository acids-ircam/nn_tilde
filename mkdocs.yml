site_name: nn~ documentation
site_description: Real-time deep learning models in Max/MSP and PureData
site_url: https://acids-ircam.github.io/nn_tilde/
repo_url: https://github.com/acids-ircam/nn_tilde
repo_name: acids-ircam/nn_tilde
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Installation: installation.md
  - Detailed description: description.md
  - Functionalities: reference.md
  - Wrapping models: wrapping.md

theme:
  name: material
  font: false            # fonts are set in docs/stylesheets/theme.css
  logo: assets/nnlogo.png   # copy of assets/nnlogo.png (only docs/ is published)
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

plugins:
  - search

# all visual settings (colors, fonts, sizes) live in this file
extra_css:
  - stylesheets/theme.css

validation:
  links:
    not_found: warn
    anchors: warn

# docs/requirements.txt is for building the site, not a page
exclude_docs: |
  requirements.txt
